<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shavkatbekov Muhammadqodir — студент TUIT</title>
  <meta name="description" content="Shavkatbekov Muhammadqodir — студент TUIT (Ташкентский университет информационных технологий). Контакты.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #7c3aed 50%, #ec4899);
      background-size: 200% 200%;
      animation: bg 12s ease infinite;
      color: #1f2937;
    }

    @keyframes bg {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      animation: up 0.8s ease both;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
    }

    h1 {
      font-size: 26px;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      color: #4f46e5;
      background: #eef2ff;
      margin-bottom: 28px;
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      margin-bottom: 28px;
    }

    .phone {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .phone:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.4);
    }

    .hint {
      margin-top: 14px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">SM</div>
    <h1>Shavkatbekov Muhammadqodir</h1>
    <span class="badge">🎓 Студент TUIT</span>
    <div class="divider"></div>
    <a class="phone" href="tel:+998939649964">📞 +998 93 964 99 64</a>
    <p class="hint">Нажмите, чтобы позвонить</p>
  </main>
</body>
</html>
